apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          # Echo server: shows pod hostname, so you can see replicas load-balance.
          image: traefik/whoami:v1.10.4
          ports:
            - containerPort: 80
